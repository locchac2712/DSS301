<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$CONTENT_TITLE - DSS301">DSS301</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />

    <!-- Additional CSS (if needed) -->
    <th:block layout:fragment="additional-css"></th:block>
  </head>
  <body>
    <!-- Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: var(--color-primary)"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
          <i class="bi bi-graph-up-arrow"></i> DSS301
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/dss/discount}">
                <i class="bi bi-percent"></i> DSS Giảm giá
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/rfm/prediction}">
                <i class="bi bi-graph-up"></i> RFM Prediction
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/mongo/list}">
                <i class="bi bi-database"></i> Mongo Products
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/products/list}">
                <i class="bi bi-box-seam"></i> Products
              </a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item dropdown" th:if="${session.user != null}">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle"></i>
                <span th:text="${session.username}">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <span
                    class="dropdown-item-text text-muted"
                    th:text="'Role: ' + ${session.role}"
                    >Role</span
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" th:href="@{/change-password}">
                    <i class="bi bi-key"></i> Đổi mật khẩu
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                  </a>
                </li>
              </ul>
            </li>
            <li class="nav-item" th:if="${session.user == null}">
              <a class="nav-link" th:href="@{/login}">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main layout:fragment="content">
      <!-- Content will be inserted here -->
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center text-muted py-3 mt-5">
      <div class="container">
        <p class="mb-0">
          &copy; 2025 DSS301 - Decision Support System. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Additional Scripts (if needed) -->
    <th:block layout:fragment="additional-scripts"></th:block>
  </body>
</html>
