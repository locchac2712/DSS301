<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
    <title>DSS - Tối ưu Giảm giá</title>

    <th:block layout:fragment="additional-css">
      <style>
        .discount-wrapper {
          max-width: 950px;
          margin: 2rem auto;
          padding: 0 1rem 3rem;
        }

        .discount-wrapper h1 {
          font-size: 1.8rem;
          font-weight: 600;
          margin-bottom: 2rem;
          color: var(--color-text);
        }

        .discount-section {
          background-color: var(--color-white);
          border: 1px solid var(--color-border);
          padding: 1.5rem 2rem;
          border-radius: var(--border-radius-card);
          box-shadow: var(--box-shadow);
          margin-bottom: 2rem;
        }

        .discount-section h2 {
          color: var(--color-text);
          font-weight: 600;
          margin-bottom: 1.5rem;
        }

        .discount-form-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 1.5rem;
          margin-bottom: 1rem;
        }

        .discount-form-grid .form-group {
          margin-bottom: 0;
        }

        .discount-radio-group {
          display: flex;
          align-items: center;
          gap: 1.5rem;
          flex-wrap: wrap;
        }

        .discount-radio-group label {
          margin-bottom: 0;
          font-weight: 500;
          color: var(--color-text-secondary);
        }

        .discount-output-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 1.5rem;
          margin-top: 1rem;
        }

        .discount-output-grid .form-group {
          margin-bottom: 0;
        }

        .discount-chart {
          margin-top: 1.5rem;
        }

        .discount-insight {
          background-color: #e6f7ff;
          border: 1px solid #b3e0ff;
          padding: 1.5rem 2rem;
          border-radius: var(--border-radius);
          box-shadow: var(--box-shadow);
        }

        .discount-insight p {
          margin-bottom: 0.75rem;
        }

        .discount-insight p:last-child {
          margin-bottom: 0;
        }

        @media (max-width: 768px) {
          .discount-section {
            padding: 1.25rem 1.5rem;
          }

          .discount-wrapper {
            padding: 0 1rem 2rem;
          }
        }
      </style>
    </th:block>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="discount-wrapper">
        <h1>Giảm giá Tối ưu theo Khu vực</h1>

        <div class="discount-section">
          <h2>Thiết lập Mô phỏng</h2>
          <form th:action="@{/dss/discount/calculate}" method="post">
            <div class="discount-form-grid">
              <div class="form-group">
                <label for="product">Nhập Sản phẩm (StockCode):</label>
                <input
                  type="text"
                  id="product"
                  name="product"
                  class="form-control"
                  th:value="${selectedStockCode}"
                  placeholder="Ví dụ: 22633"
                  required
                />
              </div>

              <div class="form-group">
                <label for="country">Chọn Quốc gia:</label>
                <select
                  id="country"
                  name="country"
                  class="form-control"
                  required
                >
                  <option value="">-- Chọn --</option>
                  <option
                    th:each="c : ${countries}"
                    th:value="${c}"
                    th:text="${c}"
                    th:selected="${c == selectedCountry}"
                  ></option>
                </select>
              </div>

              <div class="form-group">
                <label for="productName">Tên Sản phẩm (Description):</label>
                <input
                  type="text"
                  id="productName"
                  class="form-control"
                  readonly
                />
              </div>
            </div>

            <div class="form-group">
              <label>Tiêu chí Tối ưu:</label>
              <div class="discount-radio-group">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="opt-revenue"
                    name="optimizeOn"
                    value="revenue"
                    th:checked="${selectedOptimizeOn == 'revenue' or selectedOptimizeOn == null}"
                  />
                  <label class="form-check-label" for="opt-revenue"
                    >Tối ưu Doanh thu</label
                  >
                </div>

                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="opt-profit"
                    name="optimizeOn"
                    value="profit"
                    th:checked="${selectedOptimizeOn == 'profit'}"
                  />
                  <label class="form-check-label" for="opt-profit"
                    >Tối ưu Lợi nhuận</label
                  >
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">
              Chạy Phân tích
            </button>
          </form>
        </div>

        <div
          class="discount-section"
          th:if="${dssResult != null && dssResult.optimalScenario != null}"
        >
          <h2>Kết quả DSS</h2>
          <div class="discount-output-grid">
            <div class="form-group">
              <label>Mức Giảm giá Tối ưu:</label>
              <input
                type="text"
                class="form-control"
                th:value="${dssResult.optimalScenario.discountPercent} + '%'"
                readonly
              />
            </div>
            <div class="form-group">
              <label>Doanh thu Dự kiến:</label>
              <input
                type="text"
                class="form-control"
                th:value="${#numbers.formatDecimal(dssResult.optimalScenario.expectedRevenue, 1, 'COMMA', 2, 'POINT')}"
                readonly
              />
            </div>
            <div class="form-group">
              <label>Lợi nhuận Dự kiến:</label>
              <input
                type="text"
                class="form-control"
                th:value="${#numbers.formatDecimal(dssResult.optimalScenario.expectedProfit, 1, 'COMMA', 2, 'POINT')}"
                readonly
              />
            </div>
          </div>

          <canvas id="dssChart" class="discount-chart"></canvas>
        </div>

        <div
          class="discount-insight"
          th:if="${dssResult != null && dssResult.analysis != null}"
        >
          <h2>Phân tích & Gợi ý</h2>
          <p th:text="${dssResult.analysis}">Phân tích...</p>
          <p
            th:text="${dssResult.recommendation}"
            class="text-primary fw-semibold"
          >
            Gợi ý...
          </p>
        </div>
      </div>
    </section>

    <th:block layout:fragment="additional-scripts">
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
          const stockCodeInput = document.getElementById("product");
          const productNameInput = document.getElementById("productName");

          stockCodeInput.addEventListener("blur", async function () {
            const stockCode = this.value;
            productNameInput.value = "Đang tải...";
            if (!stockCode) {
              productNameInput.value = "";
              return;
            }
            try {
              const response = await fetch(
                "/api/dss/product-details/" + stockCode
              );
              if (!response.ok) {
                productNameInput.value = "Lỗi: Không tìm thấy sản phẩm";
                return;
              }
              const productData = await response.json();
              productNameInput.value = productData.description;
            } catch (error) {
              console.error("Lỗi khi lấy chi tiết sản phẩm:", error);
              productNameInput.value = "Lỗi: Không thể kết nối API";
            }
          });

          /*<![CDATA[*/
          var dssResult = /*[[${dssResult}]]*/ null;
          if (
            dssResult &&
            dssResult.allScenarios &&
            dssResult.allScenarios.length > 0
          ) {
            var scenarios = dssResult.allScenarios;
            var chartLabels = scenarios.map(function (s) {
              return s.discountPercent + "%";
            });
            var revenueData = scenarios.map(function (s) {
              return s.expectedRevenue;
            });
            var profitData = scenarios.map(function (s) {
              return s.expectedProfit;
            });

            const ctx = document.getElementById("dssChart").getContext("2d");

            new Chart(ctx, {
              type: "line",
              data: {
                labels: chartLabels,
                datasets: [
                  {
                    label: "Doanh thu (Revenue)",
                    data: revenueData,
                    borderColor: "#5932EA",
                    tension: 0.1,
                  },
                  {
                    label: "Lợi nhuận (Profit)",
                    data: profitData,
                    borderColor: "#00B087",
                    tension: 0.1,
                  },
                ],
              },
              options: {
                responsive: true,
                plugins: {
                  title: {
                    display: true,
                    text: "Mô phỏng Doanh thu & Lợi nhuận",
                  },
                },
              },
            });
          }
          /*]]>*/
        });
      </script>
    </th:block>
  </body>
</html>
