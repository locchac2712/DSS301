<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
    <title th:text="${product.id != null ? 'Edit Product' : 'Add Product'}">
      Product Form
    </title>

    <th:block layout:fragment="additional-css">
      <style>
        .product-form-wrapper {
          max-width: 900px;
          margin: 2rem auto 3rem;
          padding: 0 1.5rem;
        }

        .product-form-card {
          background-color: var(--color-white);
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius-card);
          box-shadow: var(--box-shadow);
          padding: 2rem 2.5rem;
        }

        .product-form-header h1 {
          font-size: 2rem;
          font-weight: 600;
          margin-bottom: 0.75rem;
        }

        .product-form-header p {
          color: var(--color-text-secondary);
          margin-bottom: 1.75rem;
        }

        .product-form-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 1.5rem 2rem;
        }

        .product-form-group label {
          font-size: 0.9rem;
          font-weight: 500;
          color: var(--color-text-secondary);
          margin-bottom: 0.5rem;
          display: block;
        }

        .product-form-group input {
          width: 100%;
          padding: 0.9rem 1.1rem;
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius);
          font-family: var(--font-family);
          font-size: 0.95rem;
          background-color: var(--color-bg);
        }

        .product-form-group input[readonly] {
          background-color: #eeeeee;
          cursor: not-allowed;
        }

        .product-error {
          color: var(--color-red);
          font-size: 0.8rem;
          margin-top: 0.35rem;
        }

        .product-form-actions {
          margin-top: 2.5rem;
          display: flex;
          justify-content: flex-end;
          gap: 1rem;
          flex-wrap: wrap;
        }

        @media (max-width: 768px) {
          .product-form-card {
            padding: 1.75rem 1.5rem;
          }
        }
      </style>
    </th:block>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="product-form-wrapper">
        <div class="product-form-card">
          <form
            th:action="@{/products/save}"
            th:object="${product}"
            method="post"
          >
            <div class="product-form-header">
              <h1
                th:text="${product.id != null ? 'Chỉnh sửa sản phẩm' : 'Thêm sản phẩm mới'}"
              >
                Thông tin sản phẩm
              </h1>
              <p>
                Nhập đầy đủ thông tin sản phẩm gồm mã hàng, mô tả, danh mục, giá
                và số lượng tồn kho.
              </p>
            </div>

            <div class="product-form-grid">
              <div class="product-form-group">
                <label for="id">Stock Code (ID)</label>
                <input
                  type="text"
                  id="id"
                  th:field="*{id}"
                  th:readonly="${product.id != null}"
                  th:placeholder="${product.id == null} ? 'Ví dụ: P-011 (bắt buộc)' : ''"
                  required
                />
                <span
                  class="product-error"
                  th:if="${#fields.hasErrors('id')}"
                  th:errors="*{id}"
                ></span>
              </div>

              <div class="product-form-group">
                <label for="name">Tên sản phẩm</label>
                <input
                  type="text"
                  id="name"
                  th:field="*{name}"
                  placeholder="Nhập tên sản phẩm"
                  required
                />
                <span
                  class="product-error"
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"
                ></span>
              </div>

              <div class="product-form-group">
                <label for="category">Danh mục</label>
                <input
                  type="text"
                  id="category"
                  th:field="*{category}"
                  placeholder="Nhập danh mục"
                  required
                />
                <span
                  class="product-error"
                  th:if="${#fields.hasErrors('category')}"
                  th:errors="*{category}"
                ></span>
              </div>

              <div class="product-form-group">
                <label for="price">Giá bán</label>
                <input
                  type="number"
                  id="price"
                  th:field="*{price}"
                  step="any"
                  placeholder="Ví dụ: 99.99"
                  required
                />
                <span
                  class="product-error"
                  th:if="${#fields.hasErrors('price')}"
                  th:errors="*{price}"
                ></span>
              </div>

              <div class="product-form-group">
                <label for="stockQuantity">Tồn kho</label>
                <input
                  type="number"
                  id="stockQuantity"
                  th:field="*{stockQuantity}"
                  placeholder="Ví dụ: 150"
                  required
                />
                <span
                  class="product-error"
                  th:if="${#fields.hasErrors('stockQuantity')}"
                  th:errors="*{stockQuantity}"
                ></span>
              </div>
            </div>

            <div class="product-form-actions">
              <a th:href="@{/products/list}" class="btn btn-secondary">Hủy</a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                <span
                  th:text="${product.id != null ? 'Cập nhật' : 'Lưu sản phẩm'}"
                  >Lưu sản phẩm</span
                >
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
