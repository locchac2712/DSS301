<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đổi Mật Khẩu - DSS301</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: var(--color-primary)"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
          <i class="bi bi-graph-up-arrow"></i> DSS301
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
              </a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item dropdown" th:if="${session.user != null}">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle"></i>
                <span th:text="${session.username}">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <span
                    class="dropdown-item-text text-muted"
                    th:text="'Role: ' + ${session.role}"
                    >Role</span
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" th:href="@{/change-password}">
                    <i class="bi bi-key"></i> Đổi mật khẩu
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card">
            <div class="card-header text-center">
              <h3 class="card-title mb-0">
                <i class="bi bi-key-fill text-primary"></i> Đổi Mật Khẩu
              </h3>
            </div>
            <div class="card-body">
              <!-- Hiển thị thông báo lỗi/thành công -->
              <div
                th:if="${error}"
                class="alert alert-error"
                th:text="${error}"
              ></div>
              <div
                th:if="${success}"
                class="alert alert-success"
                th:text="${success}"
              ></div>

              <form
                th:action="@{/change-password}"
                method="post"
                id="changePasswordForm"
              >
                <div class="form-group">
                  <label for="oldPassword">Mật khẩu cũ *</label>
                  <input
                    type="password"
                    id="oldPassword"
                    name="oldPassword"
                    class="form-control"
                    required
                    placeholder="Nhập mật khẩu cũ"
                    autofocus
                  />
                </div>

                <div class="form-group">
                  <label for="newPassword">Mật khẩu mới *</label>
                  <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    class="form-control"
                    required
                    placeholder="Nhập mật khẩu mới"
                    minlength="4"
                  />
                  <small class="form-text"
                    >Mật khẩu mới phải có ít nhất 4 ký tự</small
                  >
                </div>

                <div class="form-group">
                  <label for="confirmPassword">Xác nhận mật khẩu mới *</label>
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="form-control"
                    required
                    placeholder="Nhập lại mật khẩu mới"
                    minlength="4"
                  />
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Đổi Mật Khẩu
                  </button>
                  <a th:href="@{/dashboard}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Quay lại
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center text-muted py-3 mt-5">
      <div class="container">
        <p class="mb-0">
          &copy; 2025 DSS301 - Decision Support System. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Validation Script -->
    <script>
      document
        .getElementById("changePasswordForm")
        .addEventListener("submit", function (e) {
          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (newPassword !== confirmPassword) {
            e.preventDefault();
            alert("Mật khẩu mới và xác nhận không khớp!");
            return false;
          }

          if (newPassword.length < 4) {
            e.preventDefault();
            alert("Mật khẩu mới phải có ít nhất 4 ký tự!");
            return false;
          }
        });
    </script>
  </body>
</html>
