<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
<head>
    <meta charset="UTF-8" />
    <title>Mongo Data Viewer</title>

    <th:block layout:fragment="additional-css">
    <style>
        .mongo-wrapper {
          max-width: 1100px;
          margin: 2rem auto 3rem;
          padding: 0 1.5rem;
        }

        .mongo-header {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          margin-bottom: 1.5rem;
        }

        .mongo-header h1 {
          font-size: 2rem;
          font-weight: 600;
        }

        .mongo-header p {
          color: var(--color-text-secondary);
          margin-bottom: 0;
        }

        .mongo-card {
          background-color: var(--color-white);
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius-card);
          box-shadow: var(--box-shadow);
          padding: 1.75rem 2rem;
        }

        .mongo-card header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .mongo-search {
          display: flex;
          gap: 0.75rem;
          flex-wrap: wrap;
        }

        .mongo-search input {
          padding: 0.75rem 1rem;
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius);
          font-family: var(--font-family);
          font-size: 0.95rem;
          min-width: 260px;
        }

        .mongo-table {
          width: 100%;
          border-collapse: collapse;
        }

        .mongo-table th,
        .mongo-table td {
          padding: 0.9rem 0.6rem;
          border-bottom: 1px solid var(--color-border);
          text-align: left;
          font-weight: 500;
        }

        .mongo-table th {
          font-size: 0.8rem;
          text-transform: uppercase;
          color: var(--color-text-secondary);
        }

        .mongo-table td {
          color: var(--color-text);
        }

        .mongo-table td.price {
          color: var(--color-success);
          font-weight: 600;
        }

        .mongo-empty {
          text-align: center;
          color: var(--color-text-secondary);
            padding: 2rem;
        }

        .mongo-pagination {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 1.5rem;
          flex-wrap: wrap;
          gap: 0.75rem;
        }

        .mongo-pagination-info {
          color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        .mongo-pagination-controls {
          display: flex;
          gap: 0.35rem;
          flex-wrap: wrap;
        }

        .mongo-pagination-controls a {
          padding: 0.55rem 0.9rem;
          border-radius: var(--border-radius);
          border: 1px solid var(--color-border);
          color: var(--color-text-secondary);
          text-decoration: none;
          font-size: 0.9rem;
          transition: background-color 0.2s ease, color 0.2s ease,
            border-color 0.2s ease;
        }

        .mongo-pagination-controls a.active,
        .mongo-pagination-controls a:hover {
            background-color: var(--color-primary);
          color: var(--color-white);
          border-color: var(--color-primary);
        }

        .mongo-pagination-controls a.disabled {
          background-color: #f5f5f5;
          color: var(--color-border);
          cursor: not-allowed;
        }

        @media (max-width: 768px) {
          .mongo-card {
            padding: 1.5rem 1.25rem;
          }
        }
    </style>
    </th:block>
</head>
<body>
    <section layout:fragment="content">
      <div class="mongo-wrapper">
        <div class="mongo-header">
          <h1>MongoDB Raw Data Viewer</h1>
          <p>
            Xem nhanh danh sách sản phẩm gốc lưu trong MongoDB để đối soát và
            phân tích dữ liệu phi cấu trúc.
          </p>
    </div>

        <div class="mongo-card">
          <header>
            <form th:action="@{/mongo/list}" method="get" class="mongo-search">
              <input
                type="text"
                name="keyword"
                th:value="${keyword}"
                placeholder="Tìm kiếm theo stock code hoặc mô tả..."
              />
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-search"></i> Tìm kiếm
              </button>
                </form>
            </header>

          <table class="mongo-table">
                <thead>
                <tr>
                    <th>Stock Code</th>
                <th>Mô tả</th>
                <th>Đơn giá</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${dataPage.content}">
                    <td th:text="${item.stockCode}">22633</td>
                    <td th:text="${item.description}">HAND WARMER</td>
                <td
                  class="price"
                  th:text="'$' + ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}"
                >
                  $1.85
                </td>
                </tr>
                <tr th:if="${dataPage.empty}">
                <td colspan="3" class="mongo-empty">
                  Không có dữ liệu phù hợp với điều kiện tìm kiếm.
                    </td>
                </tr>
                </tbody>
            </table>

          <footer class="mongo-pagination" th:if="${dataPage.totalPages > 1}">
            <div class="mongo-pagination-info">
              Hiển thị
                    <span th:text="${dataPage.number * dataPage.size + 1}">1</span>
              đến
              <span
                th:text="${dataPage.number * dataPage.size + dataPage.numberOfElements}"
              ></span>
              trong tổng số
              <span th:text="${dataPage.totalElements}">100</span>
              bản ghi
                </div>

            <div class="mongo-pagination-controls">
              <a
                th:href="@{/mongo/list(page=${dataPage.number}, keyword=${keyword})}"
                th:classappend="${dataPage.first ? 'disabled' : ''}"
              >
                        &laquo; Prev
                    </a>
              <a
                th:each="pageNum : ${pageNumbers}"
                       th:href="@{/mongo/list(page=${pageNum}, keyword=${keyword})}"
                       th:text="${pageNum}"
                th:classappend="${pageNum == dataPage.number + 1 ? 'active' : ''}"
              ></a>
              <a
                th:href="@{/mongo/list(page=${dataPage.number + 2}, keyword=${keyword})}"
                th:classappend="${dataPage.last ? 'disabled' : ''}"
              >
                        Next &raquo;
                    </a>
                </div>
            </footer>
        </div>
    </div>
    </section>
</body>
</html>
