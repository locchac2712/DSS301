<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên Mật Khẩu - DSS301</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">DSS</div>
          <h1>Quên Mật Khẩu</h1>
          <p>Nhập tên đăng nhập để khôi phục mật khẩu</p>
        </div>

        <!-- Hiển thị thông báo lỗi/thành công -->
        <div
          th:if="${error}"
          class="alert alert-error"
          th:text="${error}"
        ></div>
        <div
          th:if="${success}"
          class="alert alert-success"
          th:text="${success}"
        ></div>

        <form th:action="@{/forgot-password}" method="post">
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              required
              placeholder="Nhập tên đăng nhập"
              autofocus
            />
            <small class="form-text"
              >Chúng tôi sẽ gửi mật khẩu mới về email đã đăng ký (nếu có)</small
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <i class="bi bi-envelope"></i> Gửi Yêu Cầu
          </button>
        </form>

        <div class="divider">hoặc</div>

        <div class="text-center">
          <p class="text-secondary mb-2">
            <a
              th:href="@{/login}"
              class="text-primary text-decoration-none fw-bold"
            >
              <i class="bi bi-arrow-left"></i> Quay lại đăng nhập
            </a>
          </p>
          <p class="text-secondary mb-0">
            Chưa có tài khoản?
            <a
              th:href="@{/register}"
              class="text-primary text-decoration-none fw-bold"
              >Đăng ký ngay</a
            >
          </p>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
